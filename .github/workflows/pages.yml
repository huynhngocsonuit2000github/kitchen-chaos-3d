name: Authorized Pages preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /kitchen-chaos-3d/
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that the verified commit is still the tip of main
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping superseded preview $GITHUB_SHA (main is at $tip)"
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
        if: steps.freshness.outputs.current == 'true'
      - name: Verify hosted entry point and resolved build
        if: steps.freshness.outputs.current == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          origin="$(echo "$PAGE_URL" | cut -d/ -f1-3)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "$PAGE_URL" -o /tmp/pages-index.html; then
              main="$(sed -n 's/.*src="\([^"]*\/assets\/[^"]*\.js\)".*/\1/p' /tmp/pages-index.html)"
              if [[ "$main" == /kitchen-chaos-3d/assets/* ]] &&
                curl --fail --silent --show-error --max-time 15 "$origin$main" -o /tmp/pages-main.js &&
                grep -Fq "$EXPECTED_SHA" /tmp/pages-main.js; then
                exit 0
              fi
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          echo "::error::Hosted preview did not serve expected build $EXPECTED_SHA"
          exit 1
