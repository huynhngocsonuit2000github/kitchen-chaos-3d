name: Authorized Pages preview
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full reviewed commit SHA from main (or its history for rollback)
        required: true
        type: string
      approval_issue:
        description: Producer publication approval reference
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed commit
        env:
          REVIEWED_SHA: ${{ inputs.sha }}
          APPROVAL: ${{ inputs.approval_issue }}
        run: |
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "${APPROVAL//[[:space:]]/}" ]]
          git merge-base --is-ancestor "$REVIEWED_SHA" HEAD
          git checkout --detach "$REVIEWED_SHA"
          echo "VITE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
      - name: Verify hosted entry point and resolved build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVIEWED_SHA: ${{ inputs.sha }}
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$PAGE_URL" -o /tmp/pages-index.html
          main="$(sed -n 's/.*src="\([^"]*\/assets\/[^"]*\.js\)".*/\1/p' /tmp/pages-index.html)"
          [[ "$main" == /* ]]
          origin="$(echo "$PAGE_URL" | cut -d/ -f1-3)"
          curl --fail --silent --show-error "$origin$main" -o /tmp/pages-main.js
          grep -Fq "$REVIEWED_SHA" /tmp/pages-main.js
